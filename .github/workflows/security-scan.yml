name: DevSecOps Security Scanning Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly security audit on Mondays at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: Secret Scanning
  # Detects hardcoded passwords, tokens, API keys, and Azure credentials in git history
  # ============================================================================
  secret-scan:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for git leak detection

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # STAGE 2: IaC Security & Compliance Scanning (Checkov)
  # Scans Terraform & Kubernetes against CIS Benchmarks and Azure Security Standards
  # ============================================================================
  iac-scan-checkov:
    name: 2. IaC Compliance Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Checkov IaC Security Scanner
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: true # Set to true to upload all findings to GitHub Security tab without breaking the run

      - name: Upload Checkov SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov-results.sarif') != ''
        with:
          sarif_file: checkov-results.sarif
          category: checkov-iac

  # ============================================================================
  # STAGE 3: Vulnerability & Misconfiguration Scanning (Aqua Trivy)
  # Scans IaC templates, configuration files, and filesystems for CVEs & misconfigs
  # ============================================================================
  iac-scan-trivy:
    name: 3. Vulnerability & Misconfig (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Trivy Security Scanner (Config & IaC)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac

  # ============================================================================
  # STAGE 4: Terraform Linting, Formatting & Provider Validation
  # Enforces Terraform best practices, Azure provider rules, and syntax correctness
  # ============================================================================
  terraform-lint-and-validate:
    name: 4. Terraform Lint & Validation (TFLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Initialize TFLint (Plugins & Rulesets)
        run: tflint --init

      - name: Run TFLint on Terraform Modules & Environments
        run: tflint --recursive --format=compact

  # ============================================================================
  # STAGE 5: Static Application Security Testing (SAST - Semgrep)
  # Scans codebase, automation scripts, and manifests for CWE/OWASP anti-patterns
  # ============================================================================
  sast-scan-semgrep:
    name: 5. SAST Security Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/terraform
          generateSarif: "1"

      - name: Upload Semgrep SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

  # ============================================================================
  # STAGE 6: Container & Dockerfile Security Scanning (Hadolint)
  # Lints Dockerfiles for privilege escalation, unpinned tags, and best practices
  # ============================================================================
  container-and-dockerfile-scan:
    name: 6. Dockerfile & Container Security (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Check for Dockerfiles
        id: check-dockerfile
        run: |
          if find . -type f \( -name "Dockerfile*" -o -name "*.dockerfile" \) | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found Dockerfile(s) to scan."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile found in repository. Skipping Hadolint."
          fi

      - name: Lint Dockerfiles with Hadolint
        if: steps.check-dockerfile.outputs.found == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: error

  # ============================================================================
  # STAGE 7: DevSecOps Quality Gate & Consolidated Scorecard Summary
  # Collects all results and outputs an executive Markdown summary to Job Summary
  # ============================================================================
  security-gate-summary:
    name: 7. DevSecOps Security Scorecard Gate
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - iac-scan-checkov
      - iac-scan-trivy
      - terraform-lint-and-validate
      - sast-scan-semgrep
      - container-and-dockerfile-scan
    if: always()
    steps:
      - name: Publish DevSecOps Summary Scorecard
        run: |
          echo "## 🛡️ DevSecOps Pipeline Security Scorecard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Security Scanning Stage | Tool | Status | Primary Focus |" >> $GITHUB_STEP_SUMMARY
          echo "| :-: | :--- | :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | **Secret Scanning** | Gitleaks | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || (needs.secret-scan.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | Leaked credentials, API keys & tokens |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | **IaC Security & Compliance** | Checkov | ${{ needs.iac-scan-checkov.result == 'success' && '✅ Passed' || (needs.iac-scan-checkov.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | CIS Azure Benchmarks, AKS/ACR policy checks |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | **Vulnerability & Misconfig** | Aqua Trivy | ${{ needs.iac-scan-trivy.result == 'success' && '✅ Passed' || (needs.iac-scan-trivy.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | CVE vulnerabilities & IaC misconfigurations |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | **Terraform Lint & Validate** | TFLint + TF CLI | ${{ needs.terraform-lint-and-validate.result == 'success' && '✅ Passed' || (needs.terraform-lint-and-validate.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | Azure provider syntax, ruleset & formatting |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | **SAST Analysis** | Semgrep | ${{ needs.sast-scan-semgrep.result == 'success' && '✅ Passed' || (needs.sast-scan-semgrep.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | Code & configuration CWE/OWASP anti-patterns |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 | **Container & Dockerfile** | Hadolint | ${{ needs.container-and-dockerfile-scan.result == 'success' && '✅ Passed' || (needs.container-and-dockerfile-scan.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | Root containers, unpinned versions & best practices |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Security Alerts**: SARIF findings from Checkov, Trivy, and Semgrep are automatically integrated into your GitHub repository's **Security > Code scanning alerts** tab." >> $GITHUB_STEP_SUMMARY

      - name: Enforce Critical Security Baseline Gate
        run: |
          if [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.terraform-lint-and-validate.result }}" != "success" ]; then
            echo "❌ Critical security gates failed (Secret leak detected or invalid Terraform syntax). Please review the job logs."
            exit 1
          fi
          echo "✅ All required baseline security gates passed successfully."
