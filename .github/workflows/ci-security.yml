name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        default: "dev"
        options: [dev]
      action:
        description: "Terraform action"
        type: choice
        default: "apply"
        options: [plan, apply, destroy]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1. Security Scanning & Terraform Validation
  security-and-validate:
    name: Security Scan & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: IaC Security Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          scan-ref: "."
          skip-dirs: "**/.terraform"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"

      - name: Setup & Validate Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.0"
          terraform_wrapper: false

      - name: Terraform Format & Validate
        working-directory: environments/${{ inputs.environment || 'dev' }}
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false -input=false
          terraform validate

  # 2. Terraform Plan / Apply / Destroy
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: security-and-validate
    if: github.event_name != 'schedule'
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      acr_login_server: ${{ steps.tf.outputs.acr_login_server }}
      aks_cluster_name: ${{ steps.tf.outputs.aks_cluster_name }}
      resource_group_name: ${{ steps.tf.outputs.resource_group_name }}
    env:
      TF_ENV: ${{ inputs.environment || 'dev' }}
      TF_ACTION: ${{ inputs.action || 'apply' }}
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.0"
          terraform_wrapper: false

      - name: Terraform Init, Plan & Apply
        id: tf
        working-directory: environments/${{ inputs.environment || 'dev' }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG || secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE || secrets.TF_STATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER || secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=${TF_ENV}.terraform.tfstate"

          if [ "${{ github.event_name }}" = "pull_request" ] || [ "$TF_ACTION" = "plan" ]; then
            terraform plan -input=false -no-color
          elif [ "$TF_ACTION" = "destroy" ]; then
            terraform destroy -auto-approve -input=false -no-color
          else
            terraform apply -auto-approve -input=false -no-color
            terraform output -json > tf_outputs.json
            echo "acr_login_server=$(jq -r '.acr_login_servers.value | to_entries[0].value // empty' tf_outputs.json)" >> "$GITHUB_OUTPUT"
            echo "aks_cluster_name=$(jq -r '.aks_cluster_names.value | to_entries[0].value // empty' tf_outputs.json)" >> "$GITHUB_OUTPUT"
            echo "resource_group_name=$(jq -r '.resource_group_ids.value | to_entries[0].value // empty' tf_outputs.json | awk -F/ '{print $NF}')" >> "$GITHUB_OUTPUT"
          fi

  # 3. Optional Docker Build & AKS Deploy
  deploy-aks:
    name: Build & Deploy to AKS
    runs-on: ubuntu-latest
    needs: terraform
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Push Image (if Dockerfile exists)
        if: hashFiles('Dockerfile') != ''
        run: |
          ACR="${{ needs.terraform.outputs.acr_login_server }}"
          az acr login --name "${ACR%%.*}"
          docker build -t "$ACR/app:${{ github.sha }}" -t "$ACR/app:latest" .
          docker push "$ACR/app:${{ github.sha }}"
          docker push "$ACR/app:latest"

      - name: Deploy to AKS (if K8s/Helm exists)
        if: hashFiles('k8s/**', 'manifests/**', 'charts/**') != ''
        run: |
          az aks get-credentials \
            --resource-group "${{ needs.terraform.outputs.resource_group_name }}" \
            --name "${{ needs.terraform.outputs.aks_cluster_name }}" \
            --overwrite-existing

          [ -d "k8s" ] && kubectl apply -f k8s/
          [ -d "manifests" ] && kubectl apply -f manifests/
          if [ -d "charts" ]; then
            for chart in charts/*; do
              [ -d "$chart" ] && helm upgrade --install "$(basename "$chart")" "$chart" --wait
            done
          fi
