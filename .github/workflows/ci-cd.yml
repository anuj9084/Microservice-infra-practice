name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        default: 'dev'
        options: [dev]
      action:
        description: 'Terraform action'
        type: choice
        default: 'apply'
        options: [plan, apply, destroy]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage 1: Security Scanning & Terraform Validation
  security:
    name: 1. Security & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: IaC Scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          skip-dirs: '**/.terraform'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.0'
          terraform_wrapper: false

      - name: Terraform Format & Validate
        working-directory: environments/${{ inputs.environment || 'dev' }}
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false -input=false
          terraform validate

  # Stage 2: Terraform Init & Plan
  plan:
    name: 2. Init & Plan
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      TF_ENV: ${{ inputs.environment || 'dev' }}
      TF_ACTION: ${{ inputs.action || 'apply' }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      TF_STATE_RG: ${{ vars.TF_STATE_RG || secrets.TF_STATE_RG }}
      TF_STATE_STORAGE: ${{ vars.TF_STATE_STORAGE || secrets.TF_STATE_STORAGE }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER || secrets.TF_STATE_CONTAINER }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.0'
          terraform_wrapper: false

      - name: Terraform Init & Plan
        working-directory: environments/${{ inputs.environment || 'dev' }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ] || [ -z "$TF_STATE_RG" ] || [ -z "$TF_STATE_STORAGE" ] || [ -z "$TF_STATE_CONTAINER" ]; then
            echo "::error::Set AZURE_CREDENTIALS secret and TF_STATE_RG, TF_STATE_STORAGE, TF_STATE_CONTAINER."
            exit 1
          fi
          export ARM_CLIENT_ID=$(jq -r '.clientId' <<< "$AZURE_CREDENTIALS")
          export ARM_CLIENT_SECRET=$(jq -r '.clientSecret' <<< "$AZURE_CREDENTIALS")
          export ARM_SUBSCRIPTION_ID=$(jq -r '.subscriptionId' <<< "$AZURE_CREDENTIALS")
          export ARM_TENANT_ID=$(jq -r '.tenantId' <<< "$AZURE_CREDENTIALS")
          echo "::add-mask::$ARM_CLIENT_SECRET"

          terraform init -input=false \
            -backend-config="resource_group_name=$TF_STATE_RG" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=${TF_ENV}.terraform.tfstate"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TF_ACTION" = "destroy" ]; then
            terraform plan -destroy -input=false -no-color
          else
            terraform plan -input=false -no-color
          fi

  # Stage 3: Terraform Apply / Destroy (Protected by GitHub Environment)
  apply:
    name: 3. Apply
    runs-on: ubuntu-latest
    needs: [security, plan]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'plan')
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      TF_ENV: ${{ inputs.environment || 'dev' }}
      TF_ACTION: ${{ inputs.action || 'apply' }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      TF_STATE_RG: ${{ vars.TF_STATE_RG || secrets.TF_STATE_RG }}
      TF_STATE_STORAGE: ${{ vars.TF_STATE_STORAGE || secrets.TF_STATE_STORAGE }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER || secrets.TF_STATE_CONTAINER }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.0'
          terraform_wrapper: false

      - name: Terraform Init & Apply
        working-directory: environments/${{ inputs.environment || 'dev' }}
        run: |
          export ARM_CLIENT_ID=$(jq -r '.clientId' <<< "$AZURE_CREDENTIALS")
          export ARM_CLIENT_SECRET=$(jq -r '.clientSecret' <<< "$AZURE_CREDENTIALS")
          export ARM_SUBSCRIPTION_ID=$(jq -r '.subscriptionId' <<< "$AZURE_CREDENTIALS")
          export ARM_TENANT_ID=$(jq -r '.tenantId' <<< "$AZURE_CREDENTIALS")
          echo "::add-mask::$ARM_CLIENT_SECRET"

          terraform init -input=false \
            -backend-config="resource_group_name=$TF_STATE_RG" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=${TF_ENV}.terraform.tfstate"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TF_ACTION" = "destroy" ]; then
            terraform destroy -auto-approve -input=false -no-color
          else
            terraform apply -auto-approve -input=false -no-color
          fi
